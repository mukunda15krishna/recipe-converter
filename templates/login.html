{% extends "base.html" %}

{% block content %}

<div class="card login-card">

    <h1>🔐 Admin Login</h1>

    <form
    action="/login"
    method="post"
    class="login-form">

        <label>Username</label>

        <input
            class="login-input"
            type="text"
            name="username"
            required>

        <label>Password</label>

        <input
            class="login-input"
            type="password"
            name="password"
            required>

        <button 
            type="submit"
            class="login-btn">  
            
            Login
        </button>

    </form>

</div>

{% endblock %}
