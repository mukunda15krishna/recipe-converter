{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>Admin Login</h1>

    <form action="/login" method="post">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required>

        <label>Password</label>

        <input
            type="password"
            name="password"
            required>

        <button 
            type="submit"
            class="small-btn">
            Login
        </button>

    </form>

</div>

{% endblock %}
