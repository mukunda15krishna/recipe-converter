<!DOCTYPE html>
<html>
<head>
    <title>Brownie Recipe Converter</title>

    <style>
        body{
            font-family: Arial;
            max-width:700px;
            margin:auto;
            padding:20px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;

required>

<button type="submit">
Calculate
</button>

</form>

</body>
</html>
