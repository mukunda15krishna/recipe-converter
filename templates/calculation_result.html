{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>{{ recipe.name }}</h1>

    <table>

        <tr>
            <th>Ingredient</th>
            <th>Required Quantity</th>
        </tr>

        {% for item in calculated_ingredients %}

        <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.quantity }} {{ item.unit }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <h2>
        📝 Recipe Notes
    </h2>

    <form
        action="/submit_note_request"
        method="post"
>
    

    <textarea
        name="note_content"
        class="suggestion-editor"
        readonly
        >{{ recipe.notes or "No notes available" }}</textarea>
    
    <br>

    <h2>
        💡 Suggest Note Change
    </h2>

    <form
        action="/submit_note_request"
        method="post"
>

    <textarea
        name="note_content"
        class="suggestion-editor"
        required
    ></textarea>

    <br><br>

    <button type="submit">
        Submit Request
    </button>

    </form>
    
    <br>

    <a href="/">
        ⬅ Back
    </a>

</div>

{% endblock %}
