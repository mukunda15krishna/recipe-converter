{% extends "base.html" %}

{% block content %}

<div class="card">


    <h1>📊 Admin Dashboard</h1>

    <div class="stats">

        <div class="stat-box">
            📖 Recipes: {{ recipe_count }}
        </div>

        <div class="stat-box">
            🥄 Ingredients:  {{ ingredient_count }}
        </div>

        <div class="stat-box">
            📜 History: {{ history_count }}
        </div>

    </div>

</div>

    <div class="card">

        <div class="header-row">

            
            <h1>➕𓌉◯𓇋Create New Recipe</h1>
    
        </div>

            <form action="/create_recipe" method="post">

                <label>Recipe Name</label>

                <input
                    class="compact-name"
                    type="text"
                    name="recipe_name"
                    placeholder="Recipe Name"
                    required>

                <button type="submit">
                    Create Recipe
                </button>

            </form>


    </div>



<div class="card">

    <h1>🥄 Add Ingredient</h1>

    <form action="/add_ingredient_admin" method="post">

        <label>Select Recipe</label>

        <select name="recipe_id" required>

            {% for recipe in recipes %}

            <option value="{{ recipe.id }}">
                {{ recipe.name }}
            </option>

            {% endfor %}

        </select>

        <div id="ingredient-container">

        <div class="compact-row">

        <input
            class="compact-name"
            type="text"
            name="ingredient_name"
            placeholder="Ingredient"
            required>

        <input
            class="compact-qty"
            type="number"
            step="0.01"
            name="quantity"
            placeholder="Qty"
            required>

        <input
            class="compact-unit"
            type="text"
            name="unit"
            placeholder="Unit"
            required>
        <button
        type="button"
        class="remove-btn"
        onclick="removeRow(this)">
        ❌
        </button>
    </div>


</div>

        <button 
        type="button"
            onclick="addRow()">
            ➕ Add Row
        </button>
<br> <br>
        <button type="submit">
    Add Ingredient
    </button>
    

    </form>

</div>



<div class="card">

    <h1>
        🛠 Manage Existing Recipes
    </h1>

    <input
    type="text"
    id="recipeSearch"
    placeholder="🔍 Search Recipe..."
    onkeyup="filterRecipes()">

    <select id="recipeSelect">

        {% for recipe in recipes %}

        <option value="{{ recipe.id }}">
            {{ recipe.name }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <button
        type="button"
        onclick="viewRecipe()">
        👁 View Recipe
    </button>

    <button
        type="button"
        onclick="manageRecipe()">
        🛠 Manage Recipe
    </button>

</div>


</div>
<script>

function addRow() {

    const container =
        document.getElementById(
            "ingredient-container"
        );

    const row =
        document.createElement("div");

    row.className =
        "compact-row";

    row.innerHTML = `
        
        
        <input
            class="compact-name"
            type="text"
            name="ingredient_name"
            placeholder="Ingredient"
            required>

        <input
            class="compact-qty"
            type="number"
            step="0.01"
            name="quantity"
            placeholder="Qty"
            required>

        <input
            class="compact-unit"
            type="text"
            name="unit"
            placeholder="Unit"
            required>


        <button
            type="button"
            class="remove-btn"
            onclick="removeRow(this)">
            ❌
        </button>

    `;

    container.appendChild(row);

}

function removeRow(button){

    const row =
        button.parentElement;

    row.remove();

}

</script>

<script>

function viewRecipe(){

    const id =
        document.getElementById(
            "recipeSelect"
        ).value;

    window.location.href =
        "/recipe/" + id;
}

function manageRecipe(){

    const id =
        document.getElementById(
            "recipeSelect"
        ).value;

    window.location.href =
        "/admin_recipe/" + id;
}

</script>

<script>

function addRow() {

    const container =
        document.getElementById(
            "ingredient-container"
        );

    const row =
        document.createElement("div");

    row.className =
        "compact-row";

    row.innerHTML = `

        <input
            class="compact-name"
            type="text"
            name="ingredient_name"
            placeholder="Ingredient"
            required>

        <input
            class="compact-qty"
            type="number"
            step="0.01"
            name="quantity"
            placeholder="Qty"
            required>

        <input
            class="compact-unit"
            type="text"
            name="unit"
            placeholder="Unit"
            required>

        <button
            type="button"
            class="remove-btn"
            onclick="removeRow(this)">
            ❌
        </button>

    `;

    container.appendChild(row);

}

function removeRow(button){

    button.parentElement.remove();

}

function viewRecipe(){

    let id =
        document.getElementById(
            "recipeSelect"
        ).value;

    window.location.href =
        "/recipe/" + id;

}

function manageRecipe(){

    let id =
        document.getElementById(
            "recipeSelect"
        ).value;

    window.location.href =
        "/admin_recipe/" + id;

}
function filterRecipes(){

    let input =
        document.getElementById(
            "recipeSearch"
        ).value.toLowerCase();

    let select =
        document.getElementById(
            "recipeSelect"
        );

    for(let i = 0; i < select.options.length; i++){

        let text =
            select.options[i].text.toLowerCase();

        if(text.includes(input)){

            select.selectedIndex = i;
            break;

        }
    }

}

</script>

{% endblock %}
