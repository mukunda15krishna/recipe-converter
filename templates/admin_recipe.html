{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1>
        🛠 Manage Recipe
    </h1>

    <h2>
        {{ recipe.name }}
    </h2>

    <br>

<a href="/edit_recipe/{{ recipe.id }}">
    <button class="small-btn">
        ✏️ Edit Recipe Name
    </button>
</a>

    

    <br>
<a
    href="/delete_recipe/{{ recipe.id }}"
    onclick="return confirm('Are you sure you want to delete this recipe?')">
    <button class="delete-btn">
        🗑️ Delete Recipe
    </button>
</a>

</div>

<div class="card">  

    <div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
">

    <h2>
        📝 Recipe Notes
    </h2>

    <a href="/edit_notes/{{ recipe.id }}">
        <button class="small-btn">
            ✏️ Edit Notes
        </button>
    </a>

</div>
    

<form
        action="/submit_note_request"
        method="post"
>

    <textarea
        name="note_content"
        class="suggestion-editor"
        Required
        >{{ recipe.notes or "No notes available" }}</textarea>
    

</div>

<div class="card">

    <h2>
        Ingredients
    </h2>

    <table>

        <tr>
            <th>Ingredient</th>
            <th>Quantity</th>
            <th>Unit</th>
            <th>Action</th>
        </tr>

        {% for ingredient in recipe.ingredients %}

        <tr>

            <td>{{ ingredient.name }}</td>

            <td>{{ ingredient.quantity }}</td>

            <td>{{ ingredient.unit }}</td>

            <td>

    <a href="/edit_ingredient/{{ ingredient.id }}">
        <button class="small-btn">
            ✏️ Edit
        </button>
    </a>

    <a
    href="/delete_ingredient/{{ ingredient.id }}"
    onclick="return confirm('Delete this ingredient?')">
        <button class="delete-btn small-btn">
            🗑️ Delete
        </button>
    </a>

</td>

        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
